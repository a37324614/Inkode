name: Repackage Inkode Windows IDE

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: Exact VS Code version to repackage, for example 1.104.0
        required: true
        type: string
      vscode_archive_sha256:
        description: Optional trusted SHA-256 for that official VS Code ZIP
        required: false
        type: string

permissions:
  contents: read

jobs:
  repack:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_DIR: Inkode-win32-x64
      VSCODE_VERSION: ${{ inputs.vscode_version }}
      VSCODE_ARCHIVE_EXPECTED_SHA256: ${{ inputs.vscode_archive_sha256 }}
      RCEDIT_SHA256: 3E7801DB1A5EDBEC91B49A24A094AAD776CB4515488EA5A4CA2289C400EADE2A

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate inputs and source files
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:VSCODE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'vscode_version must be an exact version such as 1.104.0; latest is intentionally unsupported.'
          }
          if ($env:VSCODE_ARCHIVE_EXPECTED_SHA256 -and $env:VSCODE_ARCHIVE_EXPECTED_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') {
            throw 'vscode_archive_sha256 must be blank or a 64-character SHA-256 value.'
          }
          foreach ($file in 'product.json', 'icon.ico') {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing required repository file: $file"
            }
          }

      - name: Download and unpack VS Code
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $url = "https://update.code.visualstudio.com/$env:VSCODE_VERSION/win32-x64-archive/stable"
          Invoke-WebRequest -Uri $url -OutFile vscode.zip
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath vscode.zip).Hash
          if ($env:VSCODE_ARCHIVE_EXPECTED_SHA256 -and $archiveHash -ne $env:VSCODE_ARCHIVE_EXPECTED_SHA256.ToUpperInvariant()) {
            throw "VS Code archive checksum mismatch: $archiveHash"
          }
          if (-not $env:VSCODE_ARCHIVE_EXPECTED_SHA256) {
            Write-Warning 'No expected VS Code archive hash supplied; recording the downloaded hash in BUILD-INFO.txt.'
          }
          "VS Code archive SHA-256: $archiveHash" | Tee-Object -FilePath download-info.txt

          New-Item -ItemType Directory -Path $env:PACKAGE_DIR -Force | Out-Null
          tar.exe -xf vscode.zip -C $env:PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract the VS Code archive.' }

          $codeExe = Get-ChildItem -Path $env:PACKAGE_DIR -Recurse -File -Filter Code.exe | Select-Object -First 1
          if (-not $codeExe) { throw 'Code.exe was not found after extraction.' }
          "APP_DIR=$($codeExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSCODE_ARCHIVE_SHA256=$archiveHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove selected built-in extensions
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $extensionsDir = Join-Path $env:APP_DIR 'resources\app\extensions'
          if (-not (Test-Path -LiteralPath $extensionsDir -PathType Container)) {
            throw "Built-in extensions directory not found: $extensionsDir"
          }

          # Keep this list exact: broad '*chat*' matching can remove unrelated extensions.
          $remove = @(
            'github.copilot', 'github.copilot-chat',
            'coffeescript', 'csharp', 'fsharp', 'groovy', 'handlebars',
            'hlsl', 'less', 'objective-c', 'perl', 'pug', 'r', 'razor',
            'ruby', 'rust', 'scss', 'shaderlab', 'vb'
          )
          $removed = @()
          foreach ($name in $remove) {
            $path = Join-Path $extensionsDir $name
            if (Test-Path -LiteralPath $path -PathType Container) {
              Remove-Item -LiteralPath $path -Recurse -Force
              $removed += $name
            }
          }
          "Removed built-in extensions: $($removed -join ', ')"

      - name: Trim debug files and locales
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $removedMaps = @(Get-ChildItem -Path $env:APP_DIR -Recurse -File -Include '*.map', '*.pdb')
          $removedMaps | Remove-Item -Force

          $localesDir = Join-Path $env:APP_DIR 'locales'
          if (Test-Path -LiteralPath $localesDir -PathType Container) {
            Get-ChildItem -Path $localesDir -File -Filter '*.pak' |
              Where-Object { $_.Name -notin @('en-US.pak', 'zh-CN.pak') } |
              Remove-Item -Force
          }
          "Removed $($removedMaps.Count) debug files."

      - name: Patch product configuration
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $upstreamPath = Join-Path $env:APP_DIR 'resources\app\product.json'
          if (-not (Test-Path -LiteralPath $upstreamPath -PathType Leaf)) {
            throw "Upstream product.json not found: $upstreamPath"
          }

          $product = Get-Content -LiteralPath $upstreamPath -Raw | ConvertFrom-Json -AsHashtable
          $custom = Get-Content -LiteralPath product.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($key in $custom.Keys) { $product[$key] = $custom[$key] }

          $product.enableTelemetry = $false
          $product.win32MutexName = 'inkode'
          # The corresponding extensions were removed above.
          $product.Remove('defaultChatAgent') | Out-Null
          $product.Remove('trustedExtensionAuthAccess') | Out-Null
          $product | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $upstreamPath -Encoding utf8NoBOM

      - name: Inject portable data
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $dataDir = Join-Path $env:APP_DIR 'data'
          $extensionDestination = Join-Path $dataDir 'extensions'
          $userDestination = Join-Path $dataDir 'user-data\User'
          New-Item -ItemType Directory -Force -Path $extensionDestination, $userDestination | Out-Null

          if (Test-Path -LiteralPath extensions -PathType Container) {
            Get-ChildItem -LiteralPath extensions -Force | Copy-Item -Destination $extensionDestination -Recurse -Force
          }
          if (Test-Path -LiteralPath config -PathType Container) {
            Get-ChildItem -LiteralPath config -Force | Copy-Item -Destination $userDestination -Recurse -Force
          }

      - name: Replace UI branding when icon.svg is provided
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if (-not (Test-Path -LiteralPath icon.svg -PathType Leaf)) {
            Write-Warning 'icon.svg is absent: retaining stock in-app SVG branding. icon.ico is still applied to Inkode.exe.'
            exit 0
          }

          $outDir = Join-Path $env:APP_DIR 'resources\app\out'
          $targets = @(Get-ChildItem -Path $outDir -Recurse -File -Filter '*.svg' |
            Where-Object { $_.Name -like 'letterpress*.svg' -or $_.Name -eq 'code.svg' })
          if ($targets.Count -eq 0) { throw 'No expected branding SVGs were found.' }
          foreach ($target in $targets) { Copy-Item -LiteralPath icon.svg -Destination $target.FullName -Force }

          $css = @(Get-ChildItem -Path $outDir -Recurse -File -Filter 'workbench.desktop.main.css' | Select-Object -First 1)
          if ($css.Count -eq 0) { throw 'workbench.desktop.main.css was not found.' }
          $svgBase64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes((Resolve-Path icon.svg)))
          Add-Content -LiteralPath $css[0].FullName -Encoding utf8NoBOM -Value @"

          /* Inkode branding */
          .window-appicon:not(.codicon) { background-image: url("data:image/svg+xml;base64,$svgBase64") !important; background-size: contain !important; }
          .part.editor > .content .empty-editor-group:before,
          .monaco-workbench .part.editor.has-watermark > .content.empty .editor-group-container > .editor-group-letterpress,
          .part.editor > .content .editor-group-container .editor-group-watermark > .letterpress { background-image: url("data:image/svg+xml;base64,$svgBase64") !important; background-size: 160px !important; opacity: .15 !important; }
          "@
          "Updated $($targets.Count) SVG files and $($css[0].FullName)."

      - name: Normalize icon for the Windows executable
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python -c "from PIL import Image; image = Image.open('icon.ico').convert('RGBA'); image.save('icon-rcedit.ico', format='ICO', sizes=[(256,256), (128,128), (64,64), (48,48), (32,32), (16,16)])"
          if (-not (Test-Path -LiteralPath icon-rcedit.ico -PathType Leaf)) { throw 'Could not create a valid ICO file.' }

      - name: Patch executable branding
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Invoke-WebRequest -Uri 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe' -OutFile rcedit.exe
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath rcedit.exe).Hash
          if ($actualHash -ne $env:RCEDIT_SHA256) { throw "rcedit checksum mismatch: $actualHash" }

          $codeExe = Join-Path $env:APP_DIR Code.exe
          & .\rcedit.exe $codeExe --set-icon (Resolve-Path icon-rcedit.ico) --set-version-string ProductName Inkode --set-version-string FileDescription 'Inkode Code Editor' --set-version-string InternalName Inkode --set-version-string OriginalFilename Inkode.exe
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed with exit code $LASTEXITCODE" }
          Rename-Item -LiteralPath $codeExe -NewName Inkode.exe

      - name: Update and verify CLI launcher
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $cmd = Join-Path $env:APP_DIR 'bin\code.cmd'
          if (-not (Test-Path -LiteralPath $cmd -PathType Leaf)) { throw 'bin\\code.cmd was not found.' }
          (Get-Content -LiteralPath $cmd -Raw).Replace('Code.exe', 'Inkode.exe') |
            Set-Content -LiteralPath $cmd -Encoding utf8NoBOM
          Rename-Item -LiteralPath $cmd -NewName inkode.cmd
          & (Join-Path $env:APP_DIR 'bin\inkode.cmd') --version
          if ($LASTEXITCODE -ne 0) { throw "CLI verification failed with exit code $LASTEXITCODE" }

      - name: Record build information and package
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          @(
            "VS Code version: $env:VSCODE_VERSION"
            "VS Code archive SHA-256: $env:VSCODE_ARCHIVE_SHA256"
            "Git commit: $env:GITHUB_SHA"
            "Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath (Join-Path $env:APP_DIR BUILD-INFO.txt) -Encoding utf8NoBOM

          tar.exe -a -c -f Inkode-Windows-Portable.zip -C $env:APP_DIR .
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create ZIP.' }
          $entries = tar.exe -tf Inkode-Windows-Portable.zip
          $hasExe = @($entries | Where-Object { $_ -match '(^|/)Inkode\.exe$' }).Count -gt 0
          $hasBuildInfo = @($entries | Where-Object { $_ -match '(^|/)BUILD-INFO\.txt$' }).Count -gt 0
          if ($LASTEXITCODE -ne 0 -or -not $hasExe -or -not $hasBuildInfo) {
            throw 'ZIP validation failed: Inkode.exe or BUILD-INFO.txt is missing.'
          }

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Inkode-Windows-Portable-${{ inputs.vscode_version }}
          path: Inkode-Windows-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
