name: Repackage Inkode Windows IDE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repack:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      PACKAGE_DIR: Inkode-win32-x64

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. 检查根目录必要文件
      - name: Check Required Files
        run: |
          foreach ($file in @("product.json", "icon.ico")) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "缺少仓库根目录文件：$file"
            }
          }

      # 2. 下载官方 Windows x64 ZIP 并解压
      - name: Download Official VS Code
        run: |
          Invoke-WebRequest `
            -Uri "https://update.code.visualstudio.com/latest/win32-x64-archive/stable" `
            -OutFile "vscode.zip"

          Expand-Archive `
            -Path "vscode.zip" `
            -DestinationPath $env:PACKAGE_DIR

      # 3. 动态定位并合并定制 product.json
      - name: Patch product.json
        run: |
          # 自动在解压目录中查找内置的 product.json
          $productFile = Get-ChildItem -Path $env:PACKAGE_DIR -Recurse -Filter "product.json" | Select-Object -First 1
          if (-not $productFile) {
            throw "在 $env:PACKAGE_DIR 下未找到任何 product.json！"
          }
          $targetProductPath = $productFile.FullName
          Write-Host "已定位内部配置文件: $targetProductPath"

          # 读取解压包自带的配置
          $product = Get-Content -LiteralPath $targetProductPath -Raw | ConvertFrom-Json -AsHashtable

          # 合并仓库根目录你的自定义配置
          if (Test-Path "product.json") {
            Write-Host "正在合并根目录自定义 product.json..."
            $custom = Get-Content -LiteralPath "product.json" -Raw | ConvertFrom-Json -AsHashtable
            foreach ($key in $custom.Keys) {
              $product[$key] = $custom[$key]
            }
          }

          # 注入独立互斥锁名称（防止与系统原生 VS Code 产生实例冲突）
          $product["win32MutexName"] = "inkode"

          # 保存写回
          $product | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $targetProductPath -Encoding utf8NoBOM
          Write-Host "product.json 更新完成！"

      # 4. 开启便携模式：注入插件与用户配置 (合并修正版)
      - name: Inject Portable Data, Extensions & Settings
        run: |
          $dataDir = "$env:PACKAGE_DIR\data"
          $extDir = "$dataDir\extensions"
          $userDir = "$dataDir\user-data\User"

          New-Item -ItemType Directory -Path $extDir -Force | Out-Null
          New-Item -ItemType Directory -Path $userDir -Force | Out-Null

          # 拷贝提取的插件
          if (Test-Path -LiteralPath "extensions" -PathType Container) {
            Write-Host "正在注入本地插件..."
            Copy-Item -Path "extensions\*" -Destination $extDir -Recurse -Force
          }

          # 拷贝预设配置（如 config/settings.json, config/keybindings.json）
          if (Test-Path -LiteralPath "config" -PathType Container) {
            Write-Host "正在注入用户配置..."
            Copy-Item -Path "config\*" -Destination $userDir -Recurse -Force
          }

      # 5. 下载 rcedit 修改 EXE 图标与产品信息，并改名为 Inkode.exe
      - name: Patch Icon and Exe Name
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" `
            -OutFile "rcedit.exe"

          & ".\rcedit.exe" "$env:PACKAGE_DIR\Code.exe" `
            --set-icon "icon.ico" `
            --set-version-string "ProductName" "Inkode" `
            --set-version-string "FileDescription" "墨码 Inkode" `
            --set-version-string "InternalName" "Inkode" `
            --set-version-string "OriginalFilename" "Inkode.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "修改 EXE 资源失败"
          }

          Rename-Item `
            -LiteralPath "$env:PACKAGE_DIR\Code.exe" `
            -NewName "Inkode.exe"

      # 6. 同步更新命令行启动脚本
      - name: Update CLI Launchers
        run: |
          $binDir = "$env:PACKAGE_DIR\bin"
          $cmdPath = "$binDir\code.cmd"

          $cmd = Get-Content -LiteralPath $cmdPath -Raw
          $cmd.Replace("Code.exe", "Inkode.exe") |
            Set-Content -LiteralPath $cmdPath -Encoding utf8NoBOM

          Rename-Item -LiteralPath $cmdPath -NewName "inkode.cmd"

          $shellPath = "$binDir\code"
          if (Test-Path -LiteralPath $shellPath) {
            $script = Get-Content -LiteralPath $shellPath -Raw
            $script.Replace('NAME="Code"', 'NAME="Inkode"') |
              Set-Content -LiteralPath $shellPath -Encoding utf8NoBOM

            Rename-Item -LiteralPath $shellPath -NewName "inkode"
          }

      # 7. 验证 CLI 状态
      - name: Verify CLI
        run: |
          & ".\$env:PACKAGE_DIR\bin\inkode.cmd" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Inkode 命令行启动检查失败"
          }

      # 8. 使用系统自带 tar 打包，保留符号链接与隐藏文件
      - name: Compress Custom Package
        run: |
          tar.exe -a -c -f "Inkode-Windows-Portable.zip" `
            -C $env:PACKAGE_DIR .

          if ($LASTEXITCODE -ne 0) {
            throw "压缩失败"
          }

      # 9. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inkode-Windows-Portable
          path: Inkode-Windows-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
