name: Repackage Inkode Windows IDE

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: Exact VS Code version to repackage, for example 1.104.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  repack:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      PACKAGE_DIR: Inkode-win32-x64
      VSCODE_VERSION: ${{ inputs.vscode_version }}
      RCEDIT_SHA256: 3E7801DB1A5EDBEC91B49A24A094AAD776CB4515488EA5A4CA2289C400EADE2A

    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate inputs and source files
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($env:VSCODE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'vscode_version must be an exact version such as 1.104.0; latest is intentionally unsupported.'
          }
          foreach ($file in 'product.json', 'icon.ico') {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing required repository file: $file"
            }
          }

      - name: Download and unpack VS Code
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $url = "https://update.code.visualstudio.com/$env:VSCODE_VERSION/win32-x64-archive/stable"
          Invoke-WebRequest -Uri $url -OutFile vscode.zip
          $archiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath vscode.zip).Hash
          "VS Code archive SHA-256: $archiveHash" | Tee-Object -FilePath download-info.txt

          New-Item -ItemType Directory -Path $env:PACKAGE_DIR -Force | Out-Null
          tar.exe -xf vscode.zip -C $env:PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract the VS Code archive.' }

          $codeExe = Get-ChildItem -Path $env:PACKAGE_DIR -Recurse -File -Filter Code.exe | Select-Object -First 1
          if (-not $codeExe) { throw 'Code.exe was not found after extraction.' }
          "APP_DIR=$($codeExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VSCODE_ARCHIVE_SHA256=$archiveHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove selected built-in extensions
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $extensionsDir = Join-Path $env:APP_DIR 'resources\app\extensions'
          if (-not (Test-Path -LiteralPath $extensionsDir -PathType Container)) {
            throw "Built-in extensions directory not found: $extensionsDir"
          }

          # Keep this list exact: broad '*chat*' matching can remove unrelated extensions.
          $remove = @(
            'github.copilot', 'github.copilot-chat',
            'coffeescript', 'csharp', 'fsharp', 'groovy', 'handlebars',
            'hlsl', 'less', 'objective-c', 'perl', 'pug', 'r', 'razor',
            'ruby', 'rust', 'scss', 'shaderlab', 'vb'
          )
          $removed = @()
          foreach ($name in $remove) {
            $path = Join-Path $extensionsDir $name
            if (Test-Path -LiteralPath $path -PathType Container) {
              Remove-Item -LiteralPath $path -Recurse -Force
              $removed += $name
            }
          }
          "Removed built-in extensions: $($removed -join ', ')"

      - name: Trim debug files and locales
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $removedMaps = @(Get-ChildItem -Path $env:APP_DIR -Recurse -File -Include '*.map', '*.pdb')
          $removedMaps | Remove-Item -Force

          $localesDir = Join-Path $env:APP_DIR 'locales'
          if (Test-Path -LiteralPath $localesDir -PathType Container) {
            $otherLocales = @(Get-ChildItem -Path $localesDir -File -Filter '*.pak' |
              Where-Object Name -notin 'en-US.pak', 'zh-CN.pak')